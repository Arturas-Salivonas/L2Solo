[BotPopulation]
; Master switch for optional developer logs, counters, timings and IPC.
developerDiagnostics=false
; Diagnostics: one heap snapshot of the cold worker per server boot as its heap nears its cap,
; into tmp/heap/ (~1 GB file; the worker stalls while it is written). Restart to apply.
coldWorkerHeapSnapshot = false
; Word of mouth: two bots that trust each other (clan, party or friendship), together near you in town
; or resting, share their best hunting spot out loud; the one doing worse goes to try it once.
wordOfMouthEnabled = true
; The decision trace: what every bot decided and why (situations raised, decisions taken, deaths with the
; killer, worker restarts, survived failures), into logs/decision-trace.jsonl through the history worker, kept 48 h.
; Off for players; switch it on in config/local.ini to look at a server (scripts/trace.js reads it).
decisionTrace = false
; Free loot: items on the ground that are nobody's (a dropped item, a PK's drop, a monster drop its
; party left for 15 s) may be picked up by a bot near the player, by its persona (greedy ones more).
freeLootEnabled = true
; Patronage: a background bot far richer than it needs (an event prize, lucky drops) gives a share of its
; spare Adena to a struggling clanmate or friend. Hand-me-downs: spare gear it does not wear goes to a
; clanmate or friend who would wear it, instead of a shop.
patronageEnabled = true
; Party shopping trips: a hunting party waits (up to 15 minutes, its slot kept) for a member who goes to
; town to sell its bag and restock, instead of that member leaving the party for good.
partyShoppingTrips = true
; LFP shouts: a bot looking for a party says so in trade chat ("LF healer for Cruma Tower, 31+").
lfpShoutsEnabled = true
handMeDownsEnabled = true
enabled = true
; Personal errors and learning from own actions. false = unbiased estimates,
; no new learning points; public board evidence still affects decisions. Restart to apply.
knowledgeErrorsEnabled = true
; Autonomous PvP escalation and revenge, hot and cold. Range 0..1; restart to apply.
; 0 = no initiation (self-defense remains), 0.5 = current balance, 1 = maximum aggression.
; At 1, eligible nonzero escalation chances reach 100%; zero chances and combat guards remain.
; This is an aggression level, not the probability of attacking every encountered bot.
; Higher values also tolerate worse odds and delay retreat; lower values favor escape.
pvpAggression = 0.5
; PK bots: a solo bot whose persona leans to PvP (brawlers most, gentle types almost never)
; may decide, once per hunting stay, to PK a white player near it, then waits for its moment:
; the player alone, busy fighting or hurt, and a fight it thinks it can win. Both must be at
; pkMinLevel or more, the player at most 8 levels below the bot and 2 above. A kill makes the
; bot red; it washes its karma before it starts anything again.
; pkRate scales the odds (0 = no PK bots, 1 = the persona's own odds, at most 5).
pkBotsEnabled = true
pkRate = 1
pkMinLevel = 20
; Personal manhunts: a bot you kill may swear to come back (it says so). It goes back to where it
; died for manhuntMinutes, walks up to you when it sees you and attacks once it thinks it can win.
; Assertive, PvP-minded bots do it most; each further kill by you makes it likelier.
; manhuntRate scales the odds (0 = never, 1 = the persona's own, at most 5).
manhuntEnabled = true
manhuntRate = 1
manhuntMinutes = 120
ambientScenesEnabled = true
; Mood titles: the title above a bot's name shows its level and what it thinks of you, e.g. "Lv20 Friendly",
; "Lv31 Grudge", "Lv18 Hunting you". false = bots show their own titles (a clan title) again.
botMoodTitles = true
; Faces in mood titles: "Lv20 :) Hunting" (attitude face + what it does or wants). false = one word, "Lv20 Friendly".
moodTitleFaces = true
; Moments: bots near you thank you for a heal, buff or res, say "ding" on a level-up and "nice drop!" on rare loot.
botMoments = true
; Living Bots. Allies: when you attack a bot, nearby bots may take its side (clanmates and friends
; most, a justice-minded bot against a PK, rarely a stranger); bots that like you defend you; a
; hurt bot calls for help. Each helper checks it can win; at most 3 join. allyDefenseRate scales
; the odds (0 = never, 1 = the persona's own, at most 5).
allyDefenseEnabled = true
allyDefenseRate = 1
; Gossip: what you do spreads. Kill bots and others hear of it and grow wary; heal, buff and res
; them and strangers start out friendlier.
gossipEnabled = true
; Fear and bravado: a bot afraid of you keeps its distance, a bold one with a grudge tells you so.
nerveEnabled = true
; Feelings across a wipe: a returning bot remembers how it felt about a player of the same name.
legacyFeelingsEnabled = true
; Dangerous spots: a bot that died twice at a spot stays away from it for a while and warns friends.
spotDangerEnabled = true
; Rivalries: kill-steals and kills between bots become grudges: words when they meet, sometimes a fight.
rivalriesEnabled = true
ambientSceneCooldownMs = 180000
ambientPairCooldownMs = 90000
; Town attention: bots near you say gz when you level up, bystanders call out a PK, and a fight
; draws a few watchers who walk over. One roll per bot and event, by persona; a few bots at most.
townAttentionEnabled = true
ambientSceneTtlMs = 8000
backgroundResolverEnabled = true
backgroundPartyEnabled = true
; Free compatible bots can assemble a native raid party, then choose a suitable live boss.
; Restart to apply. Keep at least this fraction of each ten-level boss band alive.
opportunisticRaidsEnabled = true
opportunisticRaidAliveFraction = 0.5
opportunisticRaidIntervalMs = 900000
opportunisticRaidMemberCooldownMs = 1800000
opportunisticRaidMaxParties = 2
; Admission forecast: maximum fight duration and matching soulshot reserve multiplier.
opportunisticRaidMaxFightSeconds = 720
opportunisticRaidShotReserve = 1.3
opportunisticRaidExpeditionMs = 2700000
phasePolicyEnabled = true
backgroundGovernorEnabled = true
backgroundJobTickMs = 250
backgroundGovernorWindowMs = 1000
backgroundGovernorIdleBudgetMs = 250
backgroundGovernorPlayerBudgetMs = 80
backgroundGovernorIdleDbQueueMax = 8
backgroundGovernorPlayerDbQueueMax = 8
backgroundGovernorLagAbortMs = 120
maxPlayingPopulation = 1700
starterBotsPerRace = 30
; New bots' starting classes by weight (C4 starting classes; the professions then split evenly).
; The default: ~75 % damage dealers, ~7 % healers, ~6 % buffers, ~12 % dwarves. A wave of
; 5 x starterBotsPerRace bots splits across the starter regions by their classes' weights.
; Existing bots keep their class.
classMix = humanFighter:18,humanMystic:4,elfFighter:16,elfMystic:6,darkFighter:17,darkMystic:6,orcFighter:16,orcMystic:5,dwarf:12
generatedColdBatchSize = 50
generatedColdSeedDelayMs = 45000
partyHistoryRetentionMs = 86400000
partyHistoryCleanupBatchSize = 1000
; A bot becomes a live body within this distance of a player: the client view (6000) plus one
; 10 s activation scan at run speed. Bodies cool 1400 further out (cooldownRadius 9000).
activationRadius = 7600
maxActivationsPerScan = 6
activationFloorDirectZ = 1200
activationFloorGeoChecksPerScan = 24
activationFloorCacheMs = 30000
activationFloorCacheLimit = 2048
devLogPlayerChat = true

