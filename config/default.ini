[LastHero]
; The Last Hero event (src/GameServer/Events/LastHero, guide solo/guides/LAST_HERO.md).
; Change these in config/local.ini under [LastHero]: that file survives updates.
; The winner's prize: Adena (0 = none) and extra items as itemId:count, comma separated,
; for example prizeItems = 3470:1, 1539:20 (a Gold Bar and 20 Greater Healing Potions).
prizeAdena = 10000000
prizeItems =
enabled = true
; An event this many minutes after the last one ended (0 = only with Start now in Alt+B or .lasthero).
everyMinutes = 120
registerMinutes = 5
prepareSeconds = 60
; When time runs out, most kills (then most HP) wins.
fightMinutes = 10
; Fighters in one event, the player included (2-136).
fighters = 100
; self = bots cast their own buffs, full = a full buff set each, none.
botBuffs = self
; Bots are picked near the player's level, at most this far when there are enough of them.
levelGap = 10
; false = no "gz" chatter in normal, shout and trade chat after the winner.
winnerChat = true
; On the floor all buffs come off, then everyone gets these (skill ids, highest level):
; Wind Walk, Haste, Acumen.
baseBuffs = 1204, 1086, 1085
; The buff draft: the player picks draftPicks of draftChoices random buffs in a dialog
; (never one that would replace a base buff); every bot gets draftPicks at random. 0 = no draft.
draftChoices = 10
draftPicks = 3
; true = no Solo Helper buffer or Full HP/MP/CP while you are in Last Hero (Alt+B stays open by default).
lockBuffer = false

